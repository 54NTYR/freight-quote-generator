{% if stats.provenance == 'history' %}
  <p class="prov">μ = {{ stats.mu }} d, σ = {{ stats.sigma }} d —
     {{ stats.n }} completed moves on this lane (last {{ stats.window_days }} d).</p>
{% else %}
  <p class="prov prov-est">Estimate — no completed-move history on this
     lane yet. Delivery interval appears after 3 logged moves.</p>
{% endif %}
