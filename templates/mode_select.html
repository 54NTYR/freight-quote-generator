<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Quote Mode - Jericho Freight</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 40px; text-align: center; }
        .logo { font-size: 36px; font-weight: bold; letter-spacing: 3px; margin-bottom: 10px; }
        .subtitle { font-size: 18px; opacity: 0.9; }
        .content { padding: 40px; }
        .section-title { color: #1e3c72; font-size: 24px; margin-bottom: 20px; font-weight: bold; }
        .button-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
        .mode-button { display: inline-flex; justify-content: center; align-items: center; padding: 22px 16px; border-radius: 12px; background: #2a5298; color: white; text-decoration: none; font-size: 18px; font-weight: 700; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.12); transition: transform 0.2s, background 0.2s; }
        .mode-button:hover { transform: translateY(-3px); background: #1e3c72; }
        .note { margin-top: 24px; color: #555; font-size: 15px; }
        .footer { text-align: center; padding: 20px; color: #666; font-size: 14px; }
        @media (max-width: 768px) { .content { padding: 24px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">JERICHO FREIGHT</div>
            <div class="subtitle">Choose your quote type to begin</div>
        </div>
        <div class="content">
            <h2 class="section-title">Select Transportation Mode</h2>
            <div class="button-grid">
                <a class="mode-button" href="/ltl">LTL</a>
                <a class="mode-button" href="/ftl">FTL</a>
                <a class="mode-button" href="/dray">DRAY</a>
                <a class="mode-button" href="/international">INTERNATIONAL</a>
            </div>
            <p class="note">The LTL option is ready now. FTL and DRAY tabs can be filled in later. International will open a dedicated quote flow.</p>
        </div>
        <div class="footer">Your trusted partner in logistics excellence.</div>
    </div>
</body>
</html>
