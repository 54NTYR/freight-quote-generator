<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Quote Mode - Jericho Freight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="container mode-select-container">
        {% include 'partials/page_header.html' %}

        <div class="page-body mode-select-body">
            <h2 class="section-title">Select Transportation Mode</h2>
            <p class="page-lede">Pick a live quote type to start.</p>
            <div class="button-grid">
                <div class="mode-dropdown" id="ltlDropdown">
                    <button
                        type="button"
                        class="mode-button mode-dropdown-trigger"
                        id="ltlDropdownTrigger"
                        aria-haspopup="true"
                        aria-expanded="false"
                        aria-controls="ltlDropdownMenu"
                    >
                        <span>LTL</span>
                        <span class="mode-dropdown-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="mode-dropdown-menu" id="ltlDropdownMenu" role="menu">
                        <div class="mode-dropdown-menu-inner">
                            <a class="mode-dropdown-link" href="{{ url_for('ltl_single_quote') }}" role="menuitem">
                                Single Shipment Quote
                                <small>Fixed pallet count on one lane</small>
                            </a>
                            <a class="mode-dropdown-link" href="{{ url_for('ltl_tiered_quote') }}" role="menuitem">
                                Tiered Quote
                                <small>Volume-based pricing tiers</small>
                            </a>
                        </div>
                    </div>
                </div>
                <a class="mode-button" href="/international">International</a>
                <a class="mode-button" href="{{ url_for('ftl_quote') }}">FTL</a>
                <a class="mode-button" href="{{ url_for('dray_quote') }}">DRAY</a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const dropdown = document.getElementById('ltlDropdown');
            const trigger = document.getElementById('ltlDropdownTrigger');
            if (!dropdown || !trigger) return;

            function setOpen(isOpen) {
                dropdown.classList.toggle('is-open', isOpen);
                trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            }

            trigger.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                setOpen(!dropdown.classList.contains('is-open'));
            });

            document.addEventListener('click', function (event) {
                if (!dropdown.contains(event.target)) {
                    setOpen(false);
                }
            });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') {
                    setOpen(false);
                    trigger.focus();
                }
            });
        })();
    </script>
</body>
</html>
