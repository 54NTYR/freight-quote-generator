<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Quote Mode - Jericho Freight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .mode-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 22px 16px;
            border-radius: 12px;
            background: #2a5298;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s, background 0.2s;
        }

        .mode-button:hover {
            transform: translateY(-3px);
            background: #1e3c72;
        }

        .note {
            margin-top: 24px;
            color: #555;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% include 'partials/page_header.html' %}

        <div class="page-body">
            <h2 class="section-title">Select Transportation Mode</h2>
            <div class="button-grid">
                <a class="mode-button" href="/ltl">LTL</a>
                <a class="mode-button" href="/ftl">FTL</a>
                <a class="mode-button" href="/dray">DRAY</a>
                <a class="mode-button" href="/international">INTERNATIONAL</a>
            </div>
    </div>
</body>
</html>
