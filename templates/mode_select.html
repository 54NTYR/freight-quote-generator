<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Quote Mode - Jericho Freight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="container mode-select-container">
        <div class="header mode-select-header">
            <img src="{{ url_for('static', filename='img/jericho-freight-logo-blue.png') }}" class="logo-img" alt="Jericho Freight">
            <div class="mode-dropdown header-settings" id="settingsDropdown">
                <button
                    type="button"
                    class="settings-cog"
                    id="settingsTrigger"
                    aria-label="Settings"
                    aria-haspopup="true"
                    aria-expanded="false"
                    aria-controls="settingsMenu"
                >
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.07 7.07 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.5.42l-.36 2.54c-.6.24-1.15.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.8 8.48a.5.5 0 0 0 .12.64L4.95 10.7c-.04.31-.06.63-.06.94s.02.63.06.94L2.92 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.34.66.22l2.39-.96c.48.39 1.03.7 1.63.94l.36 2.54c.05.24.26.42.5.42h3.8c.24 0 .45-.18.5-.42l.36-2.54c.6-.24 1.15-.55 1.63-.94l2.39.96c.24.12.52.02.66-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
                    </svg>
                </button>
                <div class="mode-dropdown-menu" id="settingsMenu" role="menu">
                    <div class="mode-dropdown-menu-inner">
                        <a class="mode-dropdown-link" href="{{ url_for('rep_setup') }}" role="menuitem">Change User</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body mode-select-body">
            <h2 class="section-title">Select Transportation Mode</h2>
            <div class="button-grid">
                <a class="mode-button" href="{{ url_for('ftl_quote') }}">FTL</a>
                <div class="mode-dropdown" id="ltlDropdown">
                    <button
                        type="button"
                        class="mode-button mode-dropdown-trigger"
                        id="ltlDropdownTrigger"
                        aria-haspopup="true"
                        aria-expanded="false"
                        aria-controls="ltlDropdownMenu"
                    >
                        <span>LTL</span>
                        <span class="mode-dropdown-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="mode-dropdown-menu" id="ltlDropdownMenu" role="menu">
                        <div class="mode-dropdown-menu-inner">
                            <a class="mode-dropdown-link" href="{{ url_for('ltl_single_quote') }}" role="menuitem">
                                Single Shipment Quote
                                <small>Fixed pallet count on one lane</small>
                            </a>
                            <a class="mode-dropdown-link" href="{{ url_for('ltl_tiered_quote') }}" role="menuitem">
                                Tiered Quote
                                <small>Volume-based pricing tiers</small>
                            </a>
                        </div>
                    </div>
                </div>
                <a class="mode-button" href="{{ url_for('dray_quote') }}">DRAY</a>
                <a class="mode-button" href="/international">International</a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            function wireDropdown(rootId, triggerId) {
                const dropdown = document.getElementById(rootId);
                const trigger = document.getElementById(triggerId);
                if (!dropdown || !trigger) return;
                function setOpen(isOpen) {
                    dropdown.classList.toggle('is-open', isOpen);
                    trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                }
                trigger.addEventListener('click', function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    setOpen(!dropdown.classList.contains('is-open'));
                });
                document.addEventListener('click', function (event) {
                    if (!dropdown.contains(event.target)) setOpen(false);
                });
                document.addEventListener('keydown', function (event) {
                    if (event.key === 'Escape') {
                        setOpen(false);
                        trigger.focus();
                    }
                });
            }
            wireDropdown('ltlDropdown', 'ltlDropdownTrigger');
            wireDropdown('settingsDropdown', 'settingsTrigger');
        })();
    </script>
</body>
</html>
