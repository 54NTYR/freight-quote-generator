<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quoting Representative - Jericho Freight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="container">
        {% set header_subtitle = 'Quoting Representative' %}
        {% include 'partials/page_header.html' %}
        <div class="page-body">
            <p class="page-lede">This name and email print on every quote. Stored on this computer only.</p>
            {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
            <form method="POST" action="{{ url_for('rep_setup') }}">
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="rep_name">Representative name</label>
                            <input type="text" id="rep_name" name="rep_name" required value="{{ rep_name or '' }}">
                        </div>
                        <div class="form-group">
                            <label for="rep_email">Representative email</label>
                            <input type="email" id="rep_email" name="rep_email" required value="{{ rep_email or '' }}">
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    {% if rep and rep.rep_name %}
                    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
</body>
</html>
