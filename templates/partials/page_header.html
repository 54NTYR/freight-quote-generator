<div class="header{% if previous_quotes is defined %} has-header-actions{% endif %}">
    <img src="{{ url_for('static', filename='img/jericho-freight-logo-blue.png') }}" class="logo-img" alt="Jericho Freight">
    {% if header_subtitle %}
    <div class="header-info">
        <div class="subtitle">{{ header_subtitle }}</div>
    </div>
    {% endif %}
    {% if previous_quotes is defined %}
    <div class="header-actions">
        <span class="header-actions-label" id="load_previous_quote_label">Load Previous Quote</span>
        <div class="header-quote-wrap">
            <button type="button" class="header-quote-toggle" id="load_previous_quote_btn" aria-labelledby="load_previous_quote_label" aria-haspopup="listbox" aria-expanded="false">Select a quote</button>
            <div class="header-quote-list" id="load_previous_quote_list" hidden role="listbox" aria-labelledby="load_previous_quote_label">
                {% for row in previous_quotes %}
                <button type="button" class="header-quote-option" role="option" data-quote="{{ row.quote_number }}">{{ row.label }}</button>
                {% endfor %}
            </div>
        </div>
    </div>
    {% endif %}
</div>
