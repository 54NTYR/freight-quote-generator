<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drayage Quote - Jericho Freight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="container">
        {% set header_subtitle = 'Drayage Quote Builder' %}
        {% include 'partials/page_header.html' %}

        <div class="page-body">
            <p class="quote-type-nav">
                <a href="{{ url_for('home') }}">Back to modes</a>
            </p>

            <form id="quoteForm" method="POST" action="{{ url_for('dray_quote') }}">
                <div class="form-section">
                    <h2 class="section-title">Customer</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="customer_name">Customer name</label>
                            <input type="text" id="customer_name" name="customer_name" placeholder="e.g., Acme Foods">
                        </div>
                        <div class="form-group">
                            <label for="contact_email">Contact email</label>
                            <input type="email" id="contact_email" name="contact_email" placeholder="e.g., receiving@acme.com">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="section-title">Route / Lane</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="direction">Direction</label>
                            <select id="direction" name="direction">
                                <option value="import">Import</option>
                                <option value="export">Export</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="terminal">Terminal</label>
                            <input type="text" id="terminal" name="terminal" placeholder="e.g., Maher, APMT">
                        </div>
                        <div class="form-group">
                            <label for="container">Container</label>
                            <select id="container" name="container">
                                <option value="20FT">20' (TEU)</option>
                                <option value="40FT" selected>40' (FEU)</option>
                                <option value="40HC">40' High Cube</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="origin_city">Origin City</label>
                            <input type="text" id="origin_city" name="origin_city" placeholder="e.g., Newark">
                        </div>
                        <div class="form-group">
                            <label for="origin_zip">Origin ZIP Code</label>
                            <input type="text" id="origin_zip" name="origin_zip" required placeholder="e.g., 07114">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dest_city">Destination City</label>
                            <input type="text" id="dest_city" name="dest_city" placeholder="e.g., Allentown">
                        </div>
                        <div class="form-group">
                            <label for="dest_zip">Destination ZIP Code</label>
                            <input type="text" id="dest_zip" name="dest_zip" required placeholder="e.g., 18101">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="container_value">Container value ($)</label>
                            <input type="number" id="container_value" name="container_value" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="pallets">Pallet count (optional, for CO₂)</label>
                            <input type="number" id="pallets" name="pallets" min="1" step="1">
                        </div>
                        <div class="form-group">
                            <label for="valid_until">Valid Until</label>
                            <input type="date" id="valid_until" name="valid_until">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="quote_notes">Notes (will appear on quote)</label>
                        <textarea id="quote_notes" name="quote_notes" rows="3" placeholder="Optional notes to include on the quote"></textarea>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="section-title">Free Time &amp; Penalties</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="arrival_date">Container available date</label>
                            <input type="date" id="arrival_date" name="arrival_date" required>
                        </div>
                        <div class="form-group">
                            <label for="cutoff_date">Rail/vessel cutoff</label>
                            <input type="date" id="cutoff_date" name="cutoff_date">
                        </div>
                        <div class="form-group">
                            <label for="pickup_date">Planned pickup</label>
                            <input type="date" id="pickup_date" name="pickup_date">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="free_days">Free days</label>
                            <input type="number" id="free_days" name="free_days" value="5" min="0" step="1">
                        </div>
                        <div class="form-group">
                            <label for="return_days">Return window (days)</label>
                            <input type="number" id="return_days" name="return_days" value="3" min="0" step="1">
                        </div>
                        <div class="form-group">
                            <label for="congestion">Terminal congestion</label>
                            <select id="congestion" name="congestion">
                                <option value="none">None</option>
                                <option value="mild">Mild</option>
                                <option value="heavy">Heavy</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="demurrage_rate">Demurrage $/day</label>
                            <input type="number" id="demurrage_rate" name="demurrage_rate" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="per_diem_rate">Per-diem $/day</label>
                            <input type="number" id="per_diem_rate" name="per_diem_rate" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="chassis_rate">Chassis $/day</label>
                            <input type="number" id="chassis_rate" name="chassis_rate" value="35" min="0" step="0.01">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="section-title">All-In Pricing Ledger</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="loaded_miles">Loaded miles</label>
                            <input type="number" id="loaded_miles" name="loaded_miles" required min="0" step="1">
                        </div>
                        <div class="form-group">
                            <label for="empty_miles">Empty return miles</label>
                            <input type="number" id="empty_miles" name="empty_miles" value="0" min="0" step="1">
                        </div>
                        <div class="form-group">
                            <label for="linehaul_flat">Flat linehaul ($)</label>
                            <input type="number" id="linehaul_flat" name="linehaul_flat" min="0" step="0.01">
                            <span class="field-hint">Leave blank to use loaded and empty $/mi.</span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="rpm_loaded">$/mi loaded</label>
                            <input type="number" id="rpm_loaded" name="rpm_loaded" value="3.00" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="rpm_empty">$/mi empty</label>
                            <input type="number" id="rpm_empty" name="rpm_empty" min="0" step="0.01">
                            <span class="field-hint">Blank uses 85% of loaded rate.</span>
                        </div>
                        <div class="form-group">
                            <label for="fsc_pct">Fuel surcharge (%)</label>
                            <input type="number" id="fsc_pct" name="fsc_pct" min="0" step="0.1">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="chassis_days">Chassis days</label>
                            <input type="number" id="chassis_days" name="chassis_days" min="0" step="1">
                        </div>
                        <div class="form-group">
                            <label for="prepull_cost">Prepull / early-pull cost ($)</label>
                            <input type="number" id="prepull_cost" name="prepull_cost" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="accessorials">Other accessorials ($)</label>
                            <input type="number" id="accessorials" name="accessorials" min="0" step="0.01">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Generate Drayage Quote</button>
                    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const validInput = document.getElementById('valid_until');
        if (validInput && !validInput.value) {
            const d = new Date();
            d.setDate(d.getDate() + 7);
            validInput.value = d.toISOString().slice(0, 10);
        }
    </script>
</body>
</html>
