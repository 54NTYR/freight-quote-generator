<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Counter - Jericho Freight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="container">
        {% set header_subtitle = 'Quote Counter' %}
        {% include 'partials/page_header.html' %}
        <div class="page-body">
            <p class="quote-type-nav">
                <a href="{{ url_for('home') }}">Back to modes</a>
            </p>
            <form method="POST" action="{{ url_for('counter_setup') }}">
                <div class="form-section">
                    <div class="form-group">
                        <label for="quote_counter_url">Web app URL</label>
                        <input type="url" id="quote_counter_url" name="quote_counter_url" value="{{ quote_counter_url or '' }}" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="quote_counter_secret">Password</label>
                        <input type="text" id="quote_counter_secret" name="quote_counter_secret" value="{{ quote_counter_secret or '' }}" autocomplete="off">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
