name: Release (SignPath signing)

# Enable after SignPath Foundation approves your open-source project.
# See SIGNPATH.md for setup steps.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build unsigned installer
        shell: pwsh
        run: |
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pyinstaller --noconfirm freight_quote_generator.spec
          choco install innosetup -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Submit to SignPath for trusted signing
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
        continue-on-error: true

      - name: Upload unsigned artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: installer_output/FreightQuoteGenerator-Setup.exe
